# Runs the tests and the docs build. It never deploys.
# A push to main runs nothing: run the same checks locally first, with notes/scripts/check_before_push.sh.
# It runs on every pull request, when the full deploy calls it before publishing, and by hand:
#   gh workflow run ci.yml

name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python ${{ matrix.python-version }}
      - name: Tests
        run: uv run pytest -q -p no:cacheprovider
      - name: Doctests
        run: >
          uv run pytest -q -p no:cacheprovider --doctest-modules src/daffodil
          --ignore=src/daffodil/lib/daf_pdf.py --ignore=src/daffodil/lib/md_demo.py
      - name: Guide examples
        run: uv run pytest -q -p no:cacheprovider --doctest-glob='*.md' docsite/guide

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python 3.12
      - name: Build with warnings as errors
        run: uv run mkdocs build --strict -d site
