# Build the docs and deploy them to GitHub Pages. Nothing goes to PyPI. The commit must be on main.
# The full deploy calls this before the PyPI step. To update the docs alone, between releases,
# push a commit from main to the branch docs_deploy:
#   git fetch origin main && git push origin origin/main:refs/heads/docs_deploy
# or run it by hand on main:   gh workflow run docs.yml
# Docs built from main may describe changes that are not on PyPI yet.

name: Docs

on:
  push:
    branches: [docs_deploy]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    name: Deploy the docs
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::This commit is not on main."; exit 1; }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run mkdocs build --strict -d site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
