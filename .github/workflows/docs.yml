# Build the docs from main and deploy them to GitHub Pages. Nothing goes to PyPI.
# The full deploy calls this before the PyPI step. It can also run alone, to update the
# docs between releases:   gh workflow run docs.yml
# Docs built from main may describe changes that are not on PyPI yet.

name: Docs

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    name: Deploy the docs
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run mkdocs build --strict -d site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
