<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>The Daffodil data model: lol, hd, kd and dtypes</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .mono  { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }
      .lbl   { font-weight: bold; font-size: 15px; fill: #222; }
      .note  { font-size: 12.5px; fill: #444; }
      .opt   { font-size: 12px; fill: #666; font-style: italic; }
      .cell  { fill: #bdf3f7; stroke: #2a7f87; stroke-width: 1.2; }
      .key   { fill: #ffd9a6; stroke: #b36b00; stroke-width: 1.2; }
      .hd    { fill: #fff3a3; stroke: #9a8400; stroke-width: 1.2; }
      .dt    { fill: #ffc9c9; stroke: #b34747; stroke-width: 1.2; }
      .kd    { fill: #ffd9a6; stroke: #b36b00; stroke-width: 1.2; }
      .row   { fill: none; stroke: #2a7f87; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .idx   { font-size: 13px; fill: #555; }
      .arrow { stroke: #444; stroke-width: 1.3; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="468" rx="10" fill="#f7f7f5" stroke="#bbb"/>

  <!-- dtypes (optional) -->
  <text x="286" y="62" text-anchor="end" class="lbl">dtypes</text>
  <text x="286" y="76" text-anchor="end" class="opt">optional</text>
  <rect x="300" y="44" width="130" height="32" class="dt"/><text x="365" y="65" text-anchor="middle" class="mono">'id': str</text>
  <rect x="430" y="44" width="130" height="32" class="dt"/><text x="495" y="65" text-anchor="middle" class="mono">'name': str</text>
  <rect x="560" y="44" width="130" height="32" class="dt"/><text x="625" y="65" text-anchor="middle" class="mono">'tags': list</text>
  <rect x="690" y="44" width="130" height="32" class="dt"/><text x="755" y="65" text-anchor="middle" class="mono">'score': float</text>

  <!-- hd -->
  <text x="286" y="108" text-anchor="end" class="lbl">hd</text>
  <text x="286" y="122" text-anchor="end" class="opt">optional · name → col</text>
  <rect x="300" y="90" width="130" height="32" class="hd"/><text x="365" y="111" text-anchor="middle" class="mono">'id': 0</text>
  <rect x="430" y="90" width="130" height="32" class="hd"/><text x="495" y="111" text-anchor="middle" class="mono">'name': 1</text>
  <rect x="560" y="90" width="130" height="32" class="hd"/><text x="625" y="111" text-anchor="middle" class="mono">'tags': 2</text>
  <rect x="690" y="90" width="130" height="32" class="hd"/><text x="755" y="111" text-anchor="middle" class="mono">'score': 3</text>

  <!-- column indexes -->
  <text x="365" y="146" text-anchor="middle" class="idx">0</text>
  <text x="495" y="146" text-anchor="middle" class="idx">1</text>
  <text x="625" y="146" text-anchor="middle" class="idx">2</text>
  <text x="755" y="146" text-anchor="middle" class="idx">3</text>
  <text x="845" y="146" text-anchor="middle" class="idx" font-style="italic">cols</text>

  <!-- lol -->
  <text x="286" y="146" text-anchor="end" class="lbl">lol</text>

  <!-- row 0 -->
  <text x="282" y="183" text-anchor="end" class="idx">0</text>
  <rect x="300" y="160" width="130" height="36" class="key"/><text x="365" y="183" text-anchor="middle" class="mono">'r1'</text>
  <rect x="430" y="160" width="130" height="36" class="cell"/><text x="495" y="183" text-anchor="middle" class="mono">'Ann'</text>
  <rect x="560" y="160" width="130" height="36" class="cell"/><text x="625" y="183" text-anchor="middle" class="mono">['x', 'y']</text>
  <rect x="690" y="160" width="130" height="36" class="cell"/><text x="755" y="183" text-anchor="middle" class="mono">3.5</text>
  <rect x="296" y="156" width="528" height="44" rx="6" class="row"/>

  <!-- row 1 -->
  <text x="282" y="231" text-anchor="end" class="idx">1</text>
  <rect x="300" y="208" width="130" height="36" class="key"/><text x="365" y="231" text-anchor="middle" class="mono">'r2'</text>
  <rect x="430" y="208" width="130" height="36" class="cell"/><text x="495" y="231" text-anchor="middle" class="mono">'Bob'</text>
  <rect x="560" y="208" width="130" height="36" class="cell"/><text x="625" y="231" text-anchor="middle" class="mono">{'k': 1}</text>
  <rect x="690" y="208" width="130" height="36" class="cell"/><text x="755" y="231" text-anchor="middle" class="mono" fill="#555">''</text>
  <rect x="296" y="204" width="528" height="44" rx="6" class="row"/>

  <!-- row 2 -->
  <text x="282" y="279" text-anchor="end" class="idx">2</text>
  <rect x="300" y="256" width="130" height="36" class="key"/><text x="365" y="279" text-anchor="middle" class="mono">'r3'</text>
  <rect x="430" y="256" width="130" height="36" class="cell"/><text x="495" y="279" text-anchor="middle" class="mono">'Cy'</text>
  <rect x="560" y="256" width="130" height="36" class="cell"/><text x="625" y="279" text-anchor="middle" class="mono">Daf(...)</text>
  <rect x="690" y="256" width="130" height="36" class="cell"/><text x="755" y="279" text-anchor="middle" class="mono">7</text>
  <rect x="296" y="252" width="528" height="44" rx="6" class="row"/>

  <text x="282" y="312" text-anchor="end" class="idx">…</text>
  <text x="495" y="318" text-anchor="middle" class="idx">…</text>
  <text x="282" y="328" text-anchor="end" class="idx" font-style="italic">rows</text>

  <!-- callouts on the right -->
  <text x="832" y="176" class="note">each row is</text>
  <text x="832" y="191" class="note">a plain list</text>
  <text x="832" y="224" class="note"><tspan class="mono">''</tspan> is NULL,</text>
  <text x="832" y="239" class="note">a missing value</text>
  <text x="625" y="318" text-anchor="middle" class="note">a cell can hold any Python object</text>
  <path d="M 625 306 L 625 296" class="arrow"/>

  <!-- kd -->
  <text x="110" y="132" text-anchor="middle" class="lbl">kd</text>
  <text x="110" y="148" text-anchor="middle" class="opt">optional · key → row</text>
  <rect x="45" y="160" width="130" height="36" class="kd"/><text x="110" y="183" text-anchor="middle" class="mono">'r1': 0</text>
  <rect x="45" y="208" width="130" height="36" class="kd"/><text x="110" y="231" text-anchor="middle" class="mono">'r2': 1</text>
  <rect x="45" y="256" width="130" height="36" class="kd"/><text x="110" y="279" text-anchor="middle" class="mono">'r3': 2</text>
  <path d="M 177 178 L 268 178" class="arrow"/>
  <path d="M 177 226 L 268 226" class="arrow"/>
  <path d="M 177 274 L 268 274" class="arrow"/>

  <!-- keyfield note -->
  <path d="M 365 300 L 365 350 Q 365 366 349 366 L 126 366 Q 110 366 110 350 L 110 300" class="arrow" stroke-dasharray="4 3"/>
  <text x="378" y="358" class="note">kd is built from the keyfield column,</text>
  <text x="378" y="374" class="note">here keyfield='id'</text>

  <!-- footer -->
  <line x1="30" y1="396" x2="930" y2="396" stroke="#ccc"/>
  <text x="480" y="420" text-anchor="middle" class="note">Rows hold cells only. Column names are kept once, in hd; row keys once, in kd.</text>
  <text x="480" y="442" text-anchor="middle" class="note">Without hd, columns are found by index; without a keyfield, rows are found by index.</text>
</svg>
