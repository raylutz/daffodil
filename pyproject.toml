[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "daffodil"
version = "0.8.2.dev0"
authors = [
    {name = "Ray Lutz", email = "raylutz@cognisys.com"},
]
description = "Daffodil provides lightweight and fast 2-D dataframes"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"

license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "xlsx2csv>=0.8.2",
    "Markdown>=3.4.1",
]

[project.optional-dependencies]
numpy = ['numpy']
pandas = ["pandas"]
pdf = ["pdfplumber"]
pyjson5 = ["pyjson5"]                   # reads dict and list cells of CSV files much faster
sqlite = ["pysqlite3-binary; sys_platform == 'linux' and platform_machine == 'x86_64'"]     # a current SQLite for SqlDaf, where the system one is old

[project.urls]
Homepage = "https://github.com/raylutz/daffodil"
Repository = "https://github.com/raylutz/daffodil"
Issues = "https://github.com/raylutz/daffodil/issues"
Changelog = "https://github.com/raylutz/daffodil/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/raylutz/daffodil/blob/main/ROADMAP.md"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false 

[tool.setuptools]
license-files = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "daffodil[numpy,pandas,pdf,pyjson5,sqlite]",
    "objsize",
    "requests>=2.32.5",
    "xlsxwriter>=3.2.9",
    "pytest-cov>=7.1.0",
    "mkdocs<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.30.1",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "markdown"]      # optional packages, not in the dev tools
ignore_missing_imports = true
