site_name: Daffodil
docs_dir: docsite

theme:
  name: material

nav:
  - Home: index.md
  - API:
      - Daf: api/daf.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_signature: true
            separate_signature: true
            show_source: false
            members_order: source
            docstring_style: google
            docstring_options:
              returns_named_value: false