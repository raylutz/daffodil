site_name: Daffodil
site_url: https://raylutz.github.io/daffodil/
repo_url: https://github.com/raylutz/daffodil
docs_dir: docsite

theme:
  name: material

nav:
  - Home: index.md
  - API:
      - Daf: api/daf.md
      - KeyedList: api/keyedlist.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_signature: true
            separate_signature: true
            show_source: false
            members_order: source
            docstring_style: google
            docstring_options:
              returns_named_value: false