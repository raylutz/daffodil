site_name: Daffodil
site_url: https://raylutz.github.io/daffodil/
repo_url: https://github.com/raylutz/daffodil
docs_dir: docsite

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Guide:
      - Getting started: guide/getting-started.md
      - Building tables: guide/building-tables.md
      - Selecting and indexing: guide/selecting.md
      - Columns, keys and schemas: guide/columns-keys-schemas.md
      - Types and conversion: guide/types.md
      - Apply, reduce and formulas: guide/apply-reduce-formulas.md
      - Joins: guide/joins.md
      - Markdown reports: guide/markdown.md
      - Coming from pandas: guide/from-pandas.md
      - Profiling mode: profiling.md
  - Daf API:
      - api/daf/index.md
      - Structure, columns and keys: api/daf/structure.md
      - Types and schema: api/daf/types.md
      - Import and export: api/daf/convert.md
      - Selecting and indexing: api/daf/select.md
      - Modifying: api/daf/modify.md
      - Apply, reduce and group: api/daf/apply.md
      - Joins and annotation: api/daf/join.md
      - Statistics and reporting: api/daf/report.md
  - KeyedList API:
      - KeyedList: api/keyedlist.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_signature: true
            separate_signature: true
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            members_order: source
            docstring_style: google
            docstring_options:
              returns_named_value: false